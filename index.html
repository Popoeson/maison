<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student Document Capture</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading gate: covers the page until the server is live -->
  <div id="gate" class="gate">
    <div class="spinner"></div>
    <p id="gateText">Connecting to server...</p>
    <button id="gateRetry" class="btn" hidden>Retry</button>
  </div>

  <main>
    <h1>Student Document Capture</h1>

    <section class="card">
      <label for="studentName">Student name</label>
      <input id="studentName" type="text" placeholder="e.g. John Doe" autocomplete="off" autocapitalize="words">

      <label for="docCount">Number of documents</label>
      <select id="docCount"></select>
    </section>

    <div id="slots"></div>

    <button id="submitBtn" class="btn primary" disabled>Submit</button>
    <p id="status" class="status"></p>
  </main>

  <!-- Success screen -->
  <div id="done" class="gate" hidden>
    <div class="tick">✓</div>
    <h2>Submitted</h2>
    <p id="doneText"></p>
    <button id="nextBtn" class="btn primary">Next student</button>
  </div>

  <!-- Full-screen image viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <span id="viewerCap"></span>
      <button id="viewerClose" class="viewer-close" aria-label="Close">✕</button>
    </div>
    <div id="viewerStage" class="viewer-stage">
      <img id="viewerImg" alt="Document preview">
    </div>
    <p class="viewer-hint">Tap the image to zoom</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/capture.js"></script>
</body>
</html>
